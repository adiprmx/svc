name: keepalive

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data
          date -u +%FT%TZ > data/.keepalive
          git config user.name  "svc-bot"
          git config user.email "svc-bot@users.noreply.github.com"
          git add -f data/.keepalive
          git diff --cached --quiet || git commit -m "keepalive: $(date -u +%FT%TZ)"
          git push
