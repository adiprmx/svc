name: failover

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: failover
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run worker burst
        env:
          SVCMODE: worker
          SVC_DURATION: "900"
          WORKERS: "2"
          MAX_ATTEMPTS: "3"
          BACKUP_FULL: "1"
          GITHUB_TOKEN: ${{ secrets.GH_BACKUP_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python3 src/main.py
